version: "3.8"

services:
  tgfs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgfs
    restart: unless-stopped
    ports:
      - "1900:1900"
    volumes:
      - /opt/tgfs-data:/home/tgfs/.tgfs
    environment:
      - TGFS_DATA_DIR=/home/tgfs/.tgfs
      - TGFS_CONFIG_FILE=config.yaml
